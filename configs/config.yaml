app:
  name: "enterprise-workforce-agents"
  environment: "production"
  log_level: "INFO"
  cors_allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:8000"
    - "http://127.0.0.1:3000"
    - "http://127.0.0.1:8000"

security:
  jwt_secret_key: "enterprise-workforce-default-secret-key-change-in-prod"
  jwt_algorithm: "HS256"
  rate_limit_per_minute: 200

orchestration:
  max_graph_steps: 15
  execution_timeout_seconds: 30
  hitl_approval_threshold_amount: 5000.00
  checkpoint_dir: "data/checkpoints"

database:
  db_path: "data/enterprise_db.sqlite"
  max_query_rows: 100
  query_timeout_seconds: 5.0

llm:
  provider: "deterministic"  # deterministic | openai | ollama
  openai_model: "gpt-4o-mini"
  ollama_base_url: "http://localhost:11434"
